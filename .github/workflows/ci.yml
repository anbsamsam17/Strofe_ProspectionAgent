# =============================================================================
# Workflow : CI
# -----------------------------------------------------------------------------
# Role       : pipeline d'integration continue (qualite + build) du SaaS.
# Declencheurs:
#   - push sur les branches `develop` et `main`.
#   - pull_request ciblant `main`.
#   - concurrency : annule les runs precedents sur la meme ref pour economiser
#     les minutes GitHub Actions.
# Jobs :
#   - lint      : `npm run lint`.
#   - typecheck : `npm run type-check`.
#   - test      : `npm run test:coverage` + upload de l'artefact coverage/.
#   - build     : `npm run build` (depend de lint+typecheck+test), avec
#     variables d'environnement fictives (placeholders) et cache .next/cache.
# Secrets : aucun secret reel requis (le job build utilise des placeholders).
# =============================================================================

name: CI

# Principe du moindre privilege : ce workflow ne fait que lire le code source
# (checkout) et publier un artefact de couverture. Aucun job n'ecrit dans le
# depot ni n'utilise le GITHUB_TOKEN en ecriture.
permissions:
  contents: read

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

# Annule les runs précédents sur la même branche/PR pour économiser les minutes GitHub Actions
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Run LLM eval harness (offline, deterministic)
        run: npm run eval:llm

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    env:
      # Variables fictives pour que next build ne crash pas en CI
      # Elles ne donnent accès à aucune ressource réelle
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder
      NEXT_PUBLIC_APP_URL: https://placeholder.vercel.app
      NEXT_PUBLIC_SENTRY_DSN: ""
      # Variables serveur fictives pour @sentry/nextjs (withSentryConfig)
      SENTRY_ORG: placeholder-org
      SENTRY_PROJECT: placeholder-project
      SENTRY_AUTH_TOKEN: placeholder-token
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache du répertoire .next/cache pour accélérer les builds successifs
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        run: npm run build
